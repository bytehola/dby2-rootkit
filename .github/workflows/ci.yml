name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        working-directory: pc/dby2-rootctl
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        working-directory: pc/dby2-rootctl
        run: python -m py_compile dby2_rootctl/*.py

      - name: Check repository secrets
        run: ./scripts/check-secrets.sh
